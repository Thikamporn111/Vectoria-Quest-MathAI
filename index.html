<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10192d" />
  <meta name="description" content="Vectoria Quest เกมผจญภัยฝึกเวกเตอร์จากข้อสอบ Mathematics for AI & ML" />
  <title>Vectoria Quest — พิชิตดันเจี้ยนเวกเตอร์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260809-22" />
  <link rel="stylesheet" href="graph.css" />
  <link rel="stylesheet" href="multiplayer.css?v=20260809-7" />
</head>
<body>
  <div class="mist mist-one"></div><div class="mist mist-two"></div>
  <header class="topbar">
    <button class="brand" id="brandBtn" aria-label="กลับไปแผนที่"><span class="brand-mark">V</span><span>VECTORIA <small>QUEST</small></span></button>
    <div class="hero-stats" aria-label="สถานะนักผจญภัย">
      <div title="พลังชีวิต"><span>♥</span><b id="hpValue">5</b></div>
      <div title="คริสตัลความรู้"><span>◆</span><b id="xpValue">0</b></div>
      <button class="game-save-btn" id="saveGameBtn" type="button" aria-label="บันทึกเกม">💾 เซฟ</button>
      <button class="game-exit-btn" id="exitGameBtn" type="button" aria-label="ออกจากเกม">↪ ออก</button>
      <button class="sound-btn" id="soundBtn" aria-label="เปิดหรือปิดเสียง">♪</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="gameTemplate">
    <section class="game-screen screen-in">
      <div class="game-hud">
        <div class="hud-avatar" id="hudAvatar"><span>🛡️</span></div>
        <div><small id="hudPlayerName">อาริน · นักผจญภัยฝึกหัด</small><b id="floorName">ชั้น 1 ประตูพิกัด</b></div>
        <div class="hud-party-power" id="hudPartyPower"><small>กำลังปาร์ตี้</small><b>1 คน</b></div>
        <div class="hud-mission"><small>ภารกิจ</small><b id="missionText">เก็บคริสตัล 0 / 3</b></div>
        <button class="map-pill" id="sampleQuestBtn">📘 โจทย์ตัวอย่าง</button>
        <button class="map-pill prev-floor" id="previousFloorBtn">← ด่านก่อนหน้า</button>
        <button class="map-pill" id="openMapBtn">🗺 แผนที่</button>
      </div>
      <div class="game-frame">
        <canvas id="gameCanvas" width="1280" height="720" aria-label="พื้นที่เล่นเกม ใช้ปุ่มลูกศรหรือ WASD เพื่อเดิน"></canvas>
        <div class="game-dialog" id="gameDialog"><span class="dialog-face">💧</span><div><b>พิโกะ สไลม์พิกัด</b><p>เก็บคริสตัลทั้ง 3 เม็ด แล้วประตูบอสจะเปิด!</p></div><button id="closeDialog">เริ่มเลย!</button></div>
        <div class="mobile-pad" aria-label="ปุ่มควบคุมตัวละคร">
          <button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
        </div>
        <button class="action-orb" id="actionBtn">⚔<small>เข้า</small></button>
      </div>
      <div class="game-help"><span>⌨️ เดิน: WASD / ปุ่มลูกศร</span><span>◆ เก็บคริสตัลให้ครบ</span><span>👾 หลบมอนสเตอร์เงา</span><span>⚔ เดินเข้าประตูเพื่อสู้บอส</span></div>
    </section>
  </template>

  <template id="mapTemplate">
    <section class="map-screen screen-in">
      <div class="map-intro">
        <p class="eyebrow">บทที่ 01 · อาณาจักรเวกเตอร์</p>
        <h1><span>ศึกพิชิต</span><br><em>อาณาจักรเวกเตอร์</em></h1>
        <p>ร่วมเดินทางกับ <b>อาริน อัศวินฝึกหัด</b> พิชิตดันเจี้ยนเวกเตอร์ทั้ง 5 ชั้น เรียนรู้เรื่องพิกัด เวกเตอร์ตรงข้าม ขนาดเวกเตอร์ การตั้งฉาก และ Unit Vector ก่อนเผชิญบอสโจทย์จริงในแต่ละด่าน!</p>
        <div class="starter-note"><span>!</span><p><b>ไม่ต้องเก่งคณิตก่อน</b><br>ทุกด่านมีโจทย์ตัวอย่าง วิธีคิดทีละขั้น คำใบ้ และเฉลยหลังตอบ</p></div>
        <div class="map-actions">
          <button class="primary-btn" id="continueBtn">⚔ เริ่มผจญภัย <span>→</span></button>
          <button class="text-btn" id="resetBtn">เริ่มเกมใหม่</button>
        </div>
      </div>
      <div class="world-map" aria-label="แผนที่ดันเจี้ยน">
        <div class="map-title"><span>แผนที่ป่าพิกัด</span><small id="mapProgress">ผ่านแล้ว 0 / 5 ด่าน</small></div>
        <div class="route-line"></div>
        <div id="dungeonNodes"></div>
        <div class="map-decoration moon">☾</div>
        <div class="map-decoration mountain">▲ ▲</div>
        <div class="map-decoration trees">♠ ♠<br> ♠ ♠ ♠</div>
        <div class="map-decoration ruins">▥</div>
      </div>
    </section>
  </template>

  <template id="questTemplate">
    <section class="quest-screen screen-in">
      <aside class="quest-side">
        <button class="back-btn" id="backBtn">← กลับแผนที่</button>
        <p class="eyebrow" id="questNumber"></p>
        <div class="boss-portrait" id="bossPortrait"><div class="boss-aura"></div><span id="bossGlyph"></span></div>
        <h2 id="bossName"></h2>
        <p id="bossTitle"></p>
        <div class="boss-hp"><div class="boss-hp-label"><span>พลังบอส</span><b id="bossHpText">100%</b></div><div class="bar"><i id="bossHpBar"></i></div></div>
        <blockquote id="bossQuote"></blockquote>
      </aside>
      <article class="quest-card">
        <div class="stepper" id="stepper"></div>
        <div id="questContent"></div>
      </article>
    </section>
  </template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.91.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script src="app.js?v=20260810-46"></script>
  <script src="multiplayer.js?v=20260809-9"></script>
</body>
</html>
